name: G06 Repository Dispatch Target
on:
  repository_dispatch:
    types: [g06-foreign-dispatch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Commit dispatch canary under A authority
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = "G06_FOREIGN_DISPATCH_RESULT.txt";
            const text = [
              "A_WORKFLOW_AUTHORITY_CANARY_V1",
              "event=" + context.eventName,
              "sender=" + context.actor,
              "payload=" + JSON.stringify(context.payload.client_payload || {})
            ].join("\n") + "\n";
            const content = Buffer.from(text).toString("base64");
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "G06 dispatch target canary",
              content,
              ...(sha ? { sha } : {})
            });
            console.log("G06_DISPATCH_APPLIED", JSON.stringify({
              repo: context.repo,
              event: context.eventName,
              sender: context.actor,
              path,
              sha
            }));
